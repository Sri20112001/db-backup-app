name: Backend CI

on:
  push:
    paths:
      - "server/**"
      - "proto/**"
  pull_request:
    paths:
      - "server/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backup_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        working-directory: server
        run: go mod download

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Build
        working-directory: server
        run: go build ./...

      - name: Test
        working-directory: server
        env:
          DATABASE_URL: "host=localhost user=postgres password=postgres dbname=backup_saas_test port=5432 sslmode=disable"
          JWT_SECRET: "test-secret-32-bytes-long-padding"
          JWT_REFRESH_SECRET: "test-refresh-secret-32-bytes-pad"
          ENCRYPTION_KEY: "test-encryption-key-32-bytes-pad"
        run: go test ./... -v -timeout 60s

  build-image:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t backup-saas-api:${{ github.sha }} ./server
