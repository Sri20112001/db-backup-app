server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /vaultguard/api/ {
        proxy_pass http://server:7541/vaultguard/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket event bus (GET /vaultguard/api/ws)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # App is built with vite base '/vaultguard/', so dist assets live under
    # /vaultguard/... The Dockerfile copies dist into html/vaultguard/.
    location /vaultguard/ {
        alias /usr/share/nginx/html/vaultguard/;
        try_files $uri $uri/ /vaultguard/index.html;
    }

    location = /vaultguard {
        return 301 /vaultguard/;
    }
    
    location / {
        return 301 /vaultguard;
    }
}
