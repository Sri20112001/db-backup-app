<VirtualHost *:80>
    ServerName backup.example.com
    Redirect permanent / https://backup.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName backup.example.com

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/backup.crt
    SSLCertificateKeyFile /etc/ssl/private/backup.key

    # REST API (server listens on PORT, 7541 in docker-compose.yml)
    ProxyPreserveHost On
    ProxyPass        /vaultguard/api/ http://localhost:7541/vaultguard/api/
    ProxyPassReverse /vaultguard/api/ http://localhost:7541/vaultguard/api/

    # WebSocket event bus (live dashboard updates)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/vaultguard/api/ws$ ws://localhost:7541/vaultguard/api/ws [P,L]

    # Frontend static files
    DocumentRoot /var/www/backup-saas
    <Directory /var/www/backup-saas>
        Options -Indexes
        AllowOverride All
        Require all granted
        # SPA fallback
        FallbackResource /index.html
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/backup_error.log
    CustomLog ${APACHE_LOG_DIR}/backup_access.log combined
</VirtualHost>
