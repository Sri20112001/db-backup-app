version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backup_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      DATABASE_URL: "host=postgres user=postgres password=postgres dbname=backup_saas port=5432 sslmode=disable"
      JWT_SECRET: "change-me-in-production-32chars!!"
      JWT_REFRESH_SECRET: "change-me-refresh-32chars-secret"
      ENCRYPTION_KEY: "change-me-32-byte-encryption-key"
      PORT: "8080"
      GRPC_PORT: "9090"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
