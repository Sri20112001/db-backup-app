# VaultGuard — single canonical compose file (also used by Jenkins).
#
# Secrets are REQUIRED: export them in your shell or put them in a `.env`
# file next to this file (see `.env.example` — never commit real values).
# Docker Compose reads that `.env` file automatically for interpolation.
# There are intentionally no default secrets: the stack refuses to start
# without real ones.
#
#   Frontend → http://localhost:7540/vaultguard/
#   Backend  → http://localhost:7541/vaultguard/api/health
#   gRPC     → localhost:9090 (agents inside the compose network use server:9090)

services:
  postgres:
    build:
      context: .
      dockerfile: ./postgres/Dockerfile
    # NOTE: no `ports:` published on purpose — nothing outside this network
    # needs raw PostgreSQL access. To administer locally, use
    # `docker compose exec postgres psql -U postgres`, or temporarily add
    # `"127.0.0.1:5434:5432"`.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or .env file}
      POSTGRES_DB: db_backup
      # Least-privilege role for the backup agent (never the superuser).
      # Consumed by ./postgres-init/01-backup-role.sh on first init.
      BACKUP_DB_USER: ${BACKUP_DB_USER:-vaultguard_backup}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?Set BACKUP_DB_PASSWORD in your shell or .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "7541:7541"
      # NOTE: gRPC :9090 is intentionally NOT published. No current agent
      # dials it (agents poll REST and hold a WebSocket for cancel/logs);
      # the listener stays for compose-internal/legacy use. Re-add
      # `"127.0.0.1:9090:9090"` only if a grpc-dialing client needs it —
      # never expose it to the internet without mTLS.
    environment:
      - PORT=7541
      - GRPC_PORT=9090
      - DATABASE_URL=host=postgres user=postgres password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or .env file} dbname=db_backup port=5432 sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your shell or .env file}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in your shell or .env file}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in your shell or .env file}
      - CORS_ORIGIN=http://localhost:7540
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      - AGENT_SERVER=http://server:7541/vaultguard/api
      - AGENT_PG_HOST=postgres
      - AGENT_PG_PORT=5432
      # Least privilege: the agent backs up with vaultguard_backup, never
      # the postgres superuser (see postgres-init/ + SOP.md).
      - AGENT_PG_USER=${BACKUP_DB_USER:-vaultguard_backup}
      - AGENT_PG_PASSWORD=${BACKUP_DB_PASSWORD:?Set BACKUP_DB_PASSWORD in your shell or .env file}
    depends_on:
      - server

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "7540:80"
    depends_on:
      - server

volumes:
  postgres_data:
